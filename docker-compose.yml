version: '3.8'

services:
  whatsapp-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whatsapp-reply-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Persist WhatsApp session data
      - ./wwebjs_auth:/app/.wwebjs_auth
    environment:
      - NODE_ENV=production
      - TZ=UTC
    # Resource limits (adjust as needed)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Security options
    security_opt:
      - no-new-privileges:true
    # Don't run as root
    user: "1001:1001"

# Optional: Create named volume instead of bind mount
# volumes:
#   wwebjs_auth:
#     driver: local
